ath d="M785,380 L785,475" stroke="#46bd93" stroke-width="3" marker-end="url(#arrow)"/><path d="M295,575 L295,680" stroke="#46bd93" stroke-width="3" marker-end="url(#arrow)"/><path d="M785,575 L785,680" stroke="#46bd93" stroke-width="3" marker-end="url(#arrow)"/><path d="M295,780 L295,920" stroke="#46bd93" stroke-width="3" marker-end="url(#arrow)"/><path d="M785,780 L785,920" stroke="#46bd93" stroke-width="3" marker-end="url(#arrow)"/><text x="80" y="1130" font-family="Arial" font-size="20" fill="#c6e3d6">Conceptual Linux Engine flow. Remote builders may run separately.</text><text x="80" y="1170" font-family="Arial" font-size="20" fill="#c6e3d6">Docker Desktop runs Linux containers through its Linux environment.</text><text x="80" y="1270" font-family="Arial" font-size="22" fill="#68dfb0">Build. Run. Inspect. Verify.</text></svg>